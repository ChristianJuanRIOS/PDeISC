<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas</title>
    <link rel="stylesheet" href="/Styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>


  <body>


    <button id="toggleDark"><i class="fa-solid fa-moon"></i></button>


    <div class="container">


      <h1>Registro de Personas</h1>


      <a href="/" class="volver">
        <button>Volver al menú</button>
      </a>


      <form id="formPersona">


        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellido" placeholder="Apellido">


        <input type="number" id="edad" min="1" placeholder="Edad">


        <!-- La fecha se usa para calcular y verificar que coincida con la edad -->
        <input type="date" id="fecha">


        <select id="sexo">
          <option value="">Sexo</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
        </select>


        <input type="text" id="documento" placeholder="Documento">


        <select id="estadoCivil">
          <option value="">Estado civil</option>
          <option value="Soltero/a">Soltero/a</option>
          <option value="Casado/a">Casado/a</option>
          <option value="Divorciado/a">Divorciado/a</option>
          <option value="Viudo/a">Viudo/a</option>
          <option value="Unión convivencial">Unión convivencial</option>
        </select>


        <input type="text" id="nacionalidad" placeholder="Nacionalidad">
        <input type="text" id="telefono" placeholder="Teléfono">
        <input type="email" id="mail" placeholder="Mail">


        <!-- Si se elige "Sí", el campo cantidadHijos aparece dinámicamente con JS -->
        <select id="hijos">
          <option value="">¿Tiene hijos?</option>
          <option value="Si">Sí</option>
          <option value="No">No</option>
        </select>


        <!-- Oculto por defecto, se muestra solo si hijos === "Si" -->
        <input type="number" id="cantidadHijos" min="1" placeholder="Cantidad de hijos">


        <button type="submit">Guardar</button>


      </form>


      <!-- Acá aparecen los mensajes de éxito o error tras intentar guardar -->
      <div id="mensaje"></div>


      <h2>Personas almacenadas</h2>


      <!-- Las tarjetas de personas se generan dinámicamente desde personas.js -->
      <ul id="lista"></ul>


    </div>


    <!-- DarkMode.js va antes que personas.js para que el tema cargue primero -->
    <script src="/Scripts/DarkMode.js"></script>
    <script type="module" src="/Scripts/personas.js"></script>


  </body>
</html>
