<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Productos</title>
    <link rel="stylesheet" href="/Styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>


  <body>


    <button id="toggleDark"><i class="fa-solid fa-moon"></i></button>


    <div class="container">


      <h1>Carga de Productos</h1>


      <a href="/" class="volver">
        <button>Volver al menú</button>
      </a>


      <form id="formProducto">


        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="marca" placeholder="Marca">


        <!-- onkeydown bloquea e, E, + y - porque no tienen sentido en un precio -->
        <input
          type="number"
          id="precio"
          min="1"
          onkeydown="return !['e','E','+','-'].includes(event.key)"
          placeholder="Precio"
        >


        <input type="text" id="categoria" placeholder="Categoría">


        <!-- Mismo bloqueo de teclas que precio, el stock no puede ser negativo -->
        <input
          type="number"
          id="stock"
          min="0"
          onkeydown="return !['e','E','+','-'].includes(event.key)"
          placeholder="Stock"
        >


        <input type="text" id="color" placeholder="Color">
        <input type="text" id="peso" placeholder="Peso">
        <input type="text" id="codigo" placeholder="Código">


        <button id="btnMemoria" type="button">Guardar en Memoria</button>
        <button id="btnLocal" type="button">Guardar en localStorage</button>
        <button id="btnSession" type="button">Guardar en sessionStorage</button>


      </form>


      <!-- Acá aparecen los mensajes de éxito o error tras intentar guardar -->
      <div id="mensaje"></div>


      <!-- Las tarjetas de productos se generan dinámicamente desde productos.js -->
      <div id="listaProductos"></div>

    </div>

    
    <script src="/Scripts/DarkMode.js"></script>
    <script type="module" src="/Scripts/productos.js"></script>
    

  </body>
</html>
