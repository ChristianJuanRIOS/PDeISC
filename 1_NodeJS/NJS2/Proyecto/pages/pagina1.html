<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="/Styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>


<nav>
    <span class="nav-logo">Mi Proyecto</span>
    <a href="/p1">Clima</a>
    <a href="/p2">Cálculo</a>
    <a href="/p3">Hora</a>
    <a href="/p4">Operaciones</a>
    <a href="/p5">Estadísticas</a>
    <button class="btn-dark" id="toggleDark">
    <i class="fa-solid fa-moon"></i>
    </button>
</nav>

<div class="page-wrapper">

    <div class="page-header">
        <div class="page-header-icon i-clima">
            <i class="fa-solid fa-cloud-sun"></i>
        </div>
        <div>
            <p class="hero-label">Sección</p>
            <h1>Clima</h1>
            <p class="hero-sub">Consultá el estado del tiempo para cualquier ciudad</p>
        </div>
    </div>

    <div class="clima-card">
        <label for="ciudad" class="input-label">Ciudad</label>
        <div class="input-row">
            <input id="ciudad" placeholder="Ej: Mar del Plata, Buenos Aires...">
            <!-- onclick llama a window.consultarClima, expuesta desde el módulo JS -->
            <button type="button" onclick="consultarClima()">
                <i class="fa-solid fa-magnifying-glass"></i> Consultar
            </button>
        </div>

        <!-- Se muestra solo cuando hay un resultado; la clase "resultado-error" se agrega por JS si falla -->
        <div id="resultado-box" class="resultado-box hidden">
            <i id="icono-resultado" class="fa-solid fa-cloud-sun resultado-icon"></i>
            <div>
                <p class="resultado-ciudad" id="resultado-ciudad"></p>
                <p class="resultado-texto" id="resultado-texto"></p>
            </div>
        </div>
    </div>

    <a href="/" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Volver al menú
    </a>

</div>

<script src="/scripts/clima.js" type="module"></script>
<script type="module" src="/scripts/darkmode.js"></script>
</body>
</html>
