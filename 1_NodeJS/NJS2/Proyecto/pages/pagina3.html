<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora</title>
    <link rel="stylesheet" href="/Styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>


<nav>
    <span class="nav-logo">Mi Proyecto</span>
    <a href="/p1">Clima</a>
    <a href="/p2">Cálculo</a>
    <a href="/p3">Hora</a>
    <a href="/p4">Operaciones</a>
    <a href="/p5">Estadísticas</a>
    <button class="btn-dark" id="toggleDark">
    <i class="fa-solid fa-moon"></i>
    </button>
</nav>


<div class="page-wrapper">


    <div class="page-header">
        <div class="page-header-icon i-hora">
            <i class="fa-solid fa-clock"></i>
        </div>
        <div>
            <p class="hero-label">Sección</p>
            <h1>Hora</h1>
            <p class="hero-sub">Consultá la hora actual del sistema</p>
        </div>
    </div>


    <div class="clima-card">
        <div class="btn-row">
            <!-- onclick llama a window.mostrarHora, expuesta desde el módulo JS -->
            <button type="button" id="btn-hora" onclick="mostrarHora()">
                <i class="fa-solid fa-clock"></i> Mostrar hora
            </button>
        </div>


        <div id="resultado-box" class="resultado-box hidden">
            <!-- Color inline porque este ícono no cambia dinámicamente -->
            <i class="fa-solid fa-clock resultado-icon" style="color: #0F6E56;"></i>
            <div>
                <p class="resultado-ciudad" style="color: #0F6E56;">Hora actual</p>
                <p class="resultado-texto" id="resultado"></p>
            </div>
        </div>
    </div>


    <a href="/" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Volver al menú
    </a>


</div>


 <script src="/scripts/hora.js" type="module"></script>
 <script type="module" src="/scripts/darkmode.js"></script>
</body>
</html>
