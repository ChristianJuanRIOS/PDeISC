<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="/Styles/style.css">

<body>

  
  <!-- Botón flotante para cambiar entre modo claro y oscuro -->
  <button id="btn-darkmode" title="Cambiar tema">

    <i class="fa-solid fa-sun"></i>
  </button>


  <h1>Menú principal</h1>


  <!-- Botonera de navegación: cada botón redirige a una página distinta via index.js -->
  <div class="container">
    <button id="btn1">Página 1</button>
    <button id="btn2">Página 2</button>
    <button id="btn3">Página 3</button>
    <button id="btn4">Página 4</button>
    <button id="btn5">Página 5</button>
    <button id="btn6">Página 6</button>
  </div>
