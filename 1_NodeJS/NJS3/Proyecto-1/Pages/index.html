<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">


  <title>ControlDOM</title>
  

</head>
<body>


  <button id="btn-darkmode" title="Cambiar tema">
    <i class="fa-solid fa-moon"></i>
    <i class="fa-solid fa-sun"></i>
  </button>


  <h1 id="titulo"></h1>


  <!-- Botones que disparan funciones del DOM -->
  <div class="botones">
    <button id="btn-h1">Agregar H1</button>
    <button id="btn-texto">Cambiar texto</button>
    <button id="btn-color">Cambiar color</button>
    <button id="btn-img">Agregar imagen</button>
    <button id="btn-cambiar-img">Cambiar imagen</button>
    <button id="btn-tamano">Cambiar tamaño</button>
  </div>


  <!-- Contenedor donde se inserta la imagen dinámicamente -->
  <div id="contenedor-img"></div>


  <script type="module" src="/scripts/script.js"></script>

  
</body>
</html>
